<style>
  :root {

    --ink-soft: #5B5648;
    --ink-faint: #8B8574;
    --line: #D9D3C3;
    --accent: #3B6E63;
    --accent-soft: #E4EBE7;
    --warn: #9A5B2E;
    --warn-soft: #F3E7DB;
    --serif: 'Newsreader', Georgia, 'Times New Roman', serif;
    --sans: 'Space Grotesk', 'Helvetica Neue', Arial, sans-serif;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  :root:not([data-theme="light"]) {
    @media (prefers-color-scheme: dark) {
      --bg: #17160F;
      --bg-raised: #1D1C15;
      --ink: #EDEAE0;
      --ink-soft: #B4AE9B;
      --ink-faint: #756F5D;
      --line: #35331F;
      --accent: #7FBBAC;
      --accent-soft: #212B25;
      --warn: #D99A67;
      --warn-soft: #2B2117;
    }
  }
  :root[data-theme="dark"] {
    --bg: #17160F;
    --bg-raised: #1D1C15;
    --ink: #EDEAE0;
    --ink-soft: #B4AE9B;
    --ink-faint: #756F5D;
    --line: #35331F;
    --accent: #7FBBAC;
    --accent-soft: #212B25;
    --warn: #D99A67;
    --warn-soft: #2B2117;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--serif);
    -webkit-font-smoothing: antialiased;
    display: flex;
    flex-direction: column;
    min-height: 100%;
  }

  header.site-head {
    position: sticky;
    top: env(safe-area-inset-top, 0px);
    z-index: 30;
    background: var(--bg);
    border-bottom: 1px solid var(--line);
    padding: 14px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }
  .brand { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; min-width: 0; }
  .brand .mark { font-family: var(--serif); font-size: 24px; font-weight: 600; color: var(--ink); white-space: nowrap; }
  .brand .tagline { font-size: 15.5px; color: var(--ink-faint); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 46vw; }
  .head-controls { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
  .icon-btn {
    border: 1px solid var(--line);
    background: var(--bg-raised);
    color: var(--ink-soft);
    width: 32px; height: 32px;
    border-radius: 7px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    font-size: 21px;
  }
  .icon-btn:hover { border-color: var(--accent); color: var(--accent); }
  .icon-btn:focus-visible, a:focus-visible, summary:focus-visible, button:focus-visible, input:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }
  #menuToggle { display: none; }

  .layout { flex: 1; display: grid; grid-template-columns: 350px 1fr; min-height: 0; }

  aside.sidebar {

    padding: 14px 14px 40px;

    max-height: calc(100vh - 60px);

  }
  .search-wrap { position: relative; margin-bottom: 16px; }
  #siteSearch {
    width: 100%;
    padding: 9px 12px 9px 30px;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: var(--bg-raised);
    color: var(--ink);
    font-family: var(--serif);
    font-size: 17px;
  }
  .search-wrap::before {
    content: "⌕";
    position: absolute; left: 10px; top: 50%; transform: translateY(-50%);
    color: var(--ink-faint); font-size: 18px;
  }
  .no-match { display: none !important; }

  .top-group-label {
    font-size: 14.5px; letter-spacing: 0.06em; color: var(--ink-faint);
    padding: 14px 6px 6px; text-transform: uppercase;
  }
  .top-group-label:first-child { padding-top: 4px; }

  .group { margin-bottom: 2px; }
  .group.top-level { margin-bottom: 4px; }
  .group.top-level > summary { padding: 10px 6px; }
  .group-label.top-label { font-size: 15.5px; letter-spacing: 0.02em; }
  .group .group { margin-left: 14px; margin-top: 2px; }
  .doc-cover-link.nested-link { margin-left: 14px; font-size: 15.5px; }
  .group summary, .doc-cover-link {
    list-style: none;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 7px;
    padding: 8px 6px;
    border-radius: 6px;
    font-size: 17.5px;
    color: var(--ink-soft);
    text-decoration: none;
  }
  .group summary::-webkit-details-marker { display: none; }
  .group summary:hover, .doc-cover-link:hover { background: var(--accent-soft); color: var(--accent); }
  .group summary .chev { font-size: 13px; transition: transform 0.15s ease; color: var(--ink-faint); flex-shrink: 0; }
  .group[open] > summary .chev { transform: rotate(90deg); }
  .group-label { font-weight: 600; }

  .nested { padding-left: 16px; }
  ul.article-list { list-style: none; margin: 2px 0 6px; padding: 0 0 0 21px; }
  ul.article-list.flat { padding-left: 8px; }
  ul.article-list li { margin: 0; }
  ul.article-list a {
    display: block;
    padding: 6px 8px;
    margin: 1px 0;
    border-radius: 6px;
    font-size: 17.5px;
    line-height: 1.4;
    color: var(--ink-soft);
    text-decoration: none;
    border-left: 2px solid transparent;
  }
  ul.article-list a:hover { background: var(--accent-soft); color: var(--ink); }
  ul.article-list a.active { color: var(--accent); border-left-color: var(--accent); background: var(--accent-soft); font-weight: 500; }

  main.content { min-width: 0; padding: 44px clamp(20px, 5vw, 72px) 90px; overflow-x: hidden; }
  .content-inner { max-width: 1100px; margin: 0 auto; }

  .eyebrow { font-size: 15.5px; letter-spacing: 0.04em; color: var(--accent); margin: 0 0 14px; }
  h1.hero-title { font-family: var(--serif); font-weight: 500; font-size: clamp(31px, 4vw, 45.5px); line-height: 1.2; margin: 0 0 16px; max-width: 20ch; }
  p.hero-sub { font-size: 23.5px; line-height: 1.75; color: var(--ink-soft); max-width: 58ch; margin: 0 0 30px; }
  hr.rule { border: none; border-top: 1px solid var(--line); margin: 30px 0; }

  .disclaimer {
    border: 1px solid var(--warn);
    background: var(--warn-soft);
    color: var(--ink);
    border-radius: 10px;
    padding: 14px 16px;
    font-size: 17px;
    line-height: 1.6;
    margin-bottom: 34px;
  }
  .disclaimer b { color: var(--warn); }

  .program-grid { display: grid; gap: 12px; margin-bottom: 40px; grid-template-columns: 1fr; }
  @media (min-width: 640px) { .program-grid { grid-template-columns: 1fr 1fr; } }
  .program-card {
    display: block; text-decoration: none; color: inherit;
    border: 1px solid var(--line); border-radius: 10px;
    padding: 16px 18px; background: var(--bg-raised);
  }
  .program-card:hover { border-color: var(--accent); }
  .program-card .pc-kicker { font-size: 14.5px; color: var(--ink-faint); letter-spacing: 0.03em; margin-bottom: 6px; }
  .program-card .pc-title { font-family: var(--serif); font-size: 23px; margin: 0 0 6px; }
  .program-card .pc-desc { font-size: 17px; color: var(--ink-soft); line-height: 1.5; margin: 0; }

  .section-label { font-size: 15.5px; letter-spacing: 0.03em; color: var(--ink-faint); margin: 0 0 10px; text-transform: uppercase; }
  h2.section-title { font-family: var(--serif); font-weight: 500; font-size: 26.5px; margin: 0 0 22px; max-width: 28ch; }

  .breadcrumb { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; font-size: 17.5px; color: var(--ink-faint); margin-bottom: 20px; }
  .breadcrumb button { background: none; border: none; color: var(--accent); font-family: var(--serif); font-size: 16px; cursor: pointer; padding: 0; }
  .breadcrumb span.sep { opacity: 0.6; }

  .tag-badge {
    display: inline-block; font-size: 14.5px; padding: 3px 9px; border-radius: 20px;
    background: var(--accent-soft); color: var(--accent); margin-right: 6px; margin-bottom: 4px;
  }

  article h1.article-title { font-family: var(--serif); font-weight: 500; font-size: clamp(29px, 3.6vw, 38.5px); line-height: 1.25; margin: 0 0 8px; }
  .article-meta { font-size: 17.5px; color: var(--ink-faint); margin-bottom: 24px; }
  .article-body { font-size: 21.6px; line-height: 1.85; color: var(--ink); text-align: justify; text-justify: inter-word; }
  .article-body p { margin: 0 0 18px; text-align: justify; }
  .article-body h2 {
    font-family: var(--serif);
    font-weight: 600;
    font-size: 24px;
    line-height: 1.35;
    margin: 34px 0 16px;
    scroll-margin-top: 84px;
  }
  .article-body h3 {
    font-family: var(--serif);
    font-weight: 600;
    font-size: 22px;
    line-height: 1.4;
    margin: 28px 0 14px;
    scroll-margin-top: 84px;
  }
  .article-body a.wiki { color: var(--accent); text-decoration: underline; text-decoration-color: var(--line); text-underline-offset: 2px; }
  .article-body a.wiki:hover { text-decoration-color: var(--accent); }

  .toc-list { list-style: none; margin: 0; padding: 0; }
  .toc-list.nested-toc { padding-left: 18px; margin-top: 4px; }
  .toc-list li { border-top: 1px solid var(--line); }
  .toc-list.nested-toc li { border-top: none; }
  .toc-list li:last-child { border-bottom: 1px solid var(--line); }
  .toc-list.nested-toc li:last-child { border-bottom: none; }
  .toc-list a { display: flex; gap: 12px; align-items: baseline; padding: 12px 4px; text-decoration: none; color: var(--ink); font-size: 19px; }
  .toc-list.nested-toc a { padding: 8px 4px; font-size: 20px; }
  .toc-list a:hover { color: var(--accent); }
  .toc-num { font-family: var(--serif); font-size: 16px; color: var(--ink-faint); flex-shrink: 0; }
  .toc-chapter-title { font-family: var(--serif); font-size: 20px; font-weight: 500; margin: 22px 0 4px; }
  .toc-chapter-title:first-child { margin-top: 0; }
  .toc-section-title { font-size: 16px; color: var(--ink-faint); text-transform: uppercase; letter-spacing: 0.03em; margin: 14px 0 2px 4px; }

  .sidebar-toc {
    display: none;
    margin-top: 18px;
    padding-top: 14px;
    border-top: 1px solid var(--line);
  }
  .sidebar-toc.visible { display: block; }
  .sidebar-toc-title {
    font-size: 13px;
    letter-spacing: 0.07em;
    text-transform: uppercase;
    color: var(--ink-faint);
    padding: 0 6px 8px;
  }
  .sidebar-toc-list { list-style: none; margin: 0; padding: 0; }
  .sidebar-toc-list li { margin: 0; }
  .sidebar-toc-list a {
    display: block;
    padding: 6px 8px 6px 10px;
    border-left: 2px solid transparent;
    border-radius: 5px;
    color: var(--ink-soft);
    text-decoration: none;
    font-size: 14px;
    line-height: 1.45;
  }
  .sidebar-toc-list a:hover { background: var(--accent-soft); color: var(--accent); }
  .sidebar-toc-list a.active {
    color: var(--accent);
    border-left-color: var(--accent);
    background: var(--accent-soft);
  }

  .backlinks-box { margin-top: 40px; padding-top: 20px; border-top: 1px solid var(--line); }
  .backlinks-box h3 { font-size: 17px; letter-spacing: 0.02em; color: var(--ink-faint); text-transform: uppercase; margin: 0 0 10px; font-weight: 500; }
  .backlinks-box ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px; }
  .backlinks-box a { color: var(--ink-soft); text-decoration: none; font-size: 17.5px; padding: 5px 0; display: block; }
  .backlinks-box a:hover { color: var(--accent); }
  .backlinks-empty { font-size: 17px; color: var(--ink-faint); font-style: italic; }

  .link-preview {
    position: fixed;
    z-index: 60;
    width: 300px;
    max-width: calc(100vw - 24px);
    background: var(--bg-raised);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 13px 15px;
    box-shadow: 0 10px 28px rgba(0,0,0,0.14);
    font-family: var(--serif);
    font-size: 15px;
    line-height: 1.55;
    color: var(--ink);
    pointer-events: none;
    opacity: 0;
    transform: translateY(4px);
    transition: opacity 0.12s ease, transform 0.12s ease;
  }
  .link-preview.visible { opacity: 1; transform: translateY(0); }
  .link-preview .lp-title { font-weight: 600; color: var(--accent); margin-bottom: 5px; }
  .link-preview .lp-excerpt { color: var(--ink-soft); font-size: 14px; }
  .link-preview .lp-meta { font-size: 11.5px; color: var(--ink-faint); margin-top: 8px; font-family: var(--serif); }

  .related-nav { display: flex; justify-content: space-between; gap: 12px; margin-top: 34px; }
  .related-nav a { flex: 1; text-decoration: none; color: var(--ink-soft); font-size: 16px; border: 1px solid var(--line); border-radius: 8px; padding: 11px 13px; }
  .related-nav a:hover { border-color: var(--accent); color: var(--accent); }
  .related-nav a.next { text-align: right; }
  .related-nav .rn-label { display: block; font-size: 14px; color: var(--ink-faint); margin-bottom: 3px; }
  .related-nav .placeholder { flex: 1; }

  #about { padding-top: 26px; border-top: 1px solid var(--line); margin-top: 50px; }
  #about h2 { font-family: var(--serif); font-weight: 500; font-size: 24px; margin: 0 0 14px; }
  #about p { font-size: 17.5px; line-height: 1.7; color: var(--ink-soft); margin: 0 0 12px; max-width: 60ch; }

  footer.site-foot { text-align: center; font-size: 15.5px; color: var(--ink-faint); padding: 22px 20px calc(22px + env(safe-area-inset-bottom, 0px)); border-top: 1px solid var(--line); }

  @media (max-width: 860px) {
    .layout { grid-template-columns: 1fr; }
    #menuToggle { display: flex; }
    aside.sidebar {
      position: fixed; top: 60px; left: 0; bottom: 0; width: min(86vw, 340px);
      max-height: none; background: var(--bg);
      transform: translateX(-100%); transition: transform 0.2s ease; z-index: 25;
      box-shadow: 2px 0 18px rgba(0,0,0,0.12);
    }
    body.menu-open aside.sidebar { transform: translateX(0); }
    body.menu-open::after { content: ""; position: fixed; inset: 60px 0 0 0; background: rgba(0,0,0,0.28); z-index: 20; }
    main.content { padding: 30px 18px 70px; }
    .brand .tagline { display: none; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>

<script>
(function () {
  const ENTRIES = {
    "vas-14": {
      kind: "law",
      doc: "vas",
      crumb: ["Chuẩn mực kế toán Việt Nam"],
      title: "VAS 14 — Doanh thu và thu nhập khác",
      meta: "Ban hành và công bố theo Quyết định số 149/2001/QĐ-BTC ngày 31 tháng 12 năm 2001 của Bộ trưởng Bộ Tài chính",
      bodyHtml: `
        <h2>HỆ THỐNG CHUẨN MỰC KẾ TOÁN VIỆT NAM</h2>
        <h3>CHUẨN MỰC SỐ 14 — DOANH THU VÀ THU NHẬP KHÁC</h3>
        <p><strong>(Ban hành và công bố theo Quyết định số 149/2001/QĐ-BTC ngày 31 tháng 12 năm 2001 của Bộ trưởng Bộ Tài chính)</strong></p>

        <h2>QUY ĐỊNH CHUNG</h2>
        <p>Mục đích của chuẩn mực này là quy định và hướng dẫn các nguyên tắc và phương pháp kế toán doanh thu và thu nhập khác, gồm: Các loại doanh thu, thời điểm ghi nhận doanh thu, phương pháp kế toán doanh thu và thu nhập khác làm cơ sở ghi sổ kế toán và lập báo cáo tài chính.</p>
        <p>Chuẩn mực này áp dụng trong kế toán các khoản doanh thu và thu nhập khác phát sinh từ các giao dịch và nghiệp vụ sau:</p>
        <p><strong>(a) Bán hàng:</strong> Bán sản phẩm do doanh nghiệp sản xuất ra và bán hàng hóa mua vào;</p>
        <p><strong>(b) Cung cấp dịch vụ:</strong> Thực hiện công việc đã thỏa thuận theo hợp đồng trong một hoặc nhiều kỳ kế toán;</p>
        <p><strong>(c) Tiền lãi, tiền bản quyền, cổ tức và lợi nhuận được chia.</strong></p>
        <p><strong>Tiền lãi:</strong> Là số tiền thu được phát sinh từ việc cho người khác sử dụng tiền, các khoản tương đương tiền hoặc các khoản còn nợ doanh nghiệp, như: Lãi cho vay, lãi tiền gửi, lãi đầu tư trái phiếu, tín phiếu, chiết khấu thanh toán...;</p>
        <p><strong>Tiền bản quyền:</strong> Là số tiền thu được phát sinh từ việc cho người khác sử dụng tài sản, như: Bằng sáng chế, nhãn hiệu thương mại, bản quyền tác giả, phần mềm máy vi tính...;</p>
        <p><strong>Cổ tức và lợi nhuận được chia:</strong> Là số tiền lợi nhuận được chia từ việc nắm giữ cổ phiếu hoặc góp vốn.</p>
        <p><strong>(d) Các khoản thu nhập khác</strong> ngoài các giao dịch và nghiệp vụ tạo ra doanh thu kể trên (Nội dung các khoản thu nhập khác quy định tại đoạn 30).</p>
        <p>Chuẩn mực này không áp dụng cho kế toán các khoản doanh thu và thu nhập khác được quy định ở các chuẩn mực kế toán khác.</p>
        <p>Các thuật ngữ trong chuẩn mực này được hiểu như sau:</p>
        <p><strong>Doanh thu:</strong> Là tổng giá trị các lợi ích kinh tế doanh nghiệp thu được trong kỳ kế toán, phát sinh từ các hoạt động sản xuất, kinh doanh thông thường của doanh nghiệp, góp phần làm tăng vốn chủ sở hữu.</p>
        <p><strong>Chiết khấu thương mại:</strong> Là khoản doanh nghiệp bán giảm giá niêm yết cho khách hàng mua hàng với khối lượng lớn.</p>
        <p><strong>Giảm giá hàng bán:</strong> Là khoản giảm trừ cho người mua do hàng hóa kém phẩm chất, sai quy cách hoặc lạc hậu thị hiếu.</p>
        <p><strong>Giá trị hàng bán bị trả lại:</strong> Là giá trị khối lượng hàng bán đã xác định là tiêu thụ bị khách hàng trả lại và từ chối thanh toán.</p>
        <p><strong>Chiết khấu thanh toán:</strong> Là khoản tiền người bán giảm trừ cho người mua, do người mua thanh toán tiền mua hàng trước thời hạn theo hợp đồng.</p>
        <p><strong>Thu nhập khác:</strong> Là khoản thu góp phần làm tăng vốn chủ sở hữu từ hoạt động ngoài các hoạt động tạo ra doanh thu.</p>
        <p><strong>Giá trị hợp lý:</strong> Là giá trị tài sản có thể trao đổi hoặc giá trị một khoản nợ được thanh toán một cách tự nguyện giữa các bên có đầy đủ hiểu biết trong sự trao đổi ngang giá.</p>

        <h2>NỘI DUNG CHUẨN MỰC</h2>
        <p>Doanh thu chỉ bao gồm tổng giá trị của các lợi ích kinh tế doanh nghiệp đã thu được hoặc sẽ thu được. Các khoản thu hộ bên thứ ba không phải là nguồn lợi ích kinh tế, không làm tăng vốn chủ sở hữu của doanh nghiệp sẽ không được coi là doanh thu (Ví dụ: Khi người nhận đại lý thu hộ tiền bán hàng cho đơn vị chủ hàng, thì doanh thu của người nhận đại lý chỉ là tiền hoa hồng được hưởng). Các khoản góp vốn của cổ đông hoặc chủ sở hữu làm tăng vốn chủ sở hữu nhưng không là doanh thu.</p>

        <h2>XÁC ĐỊNH DOANH THU</h2>
        <p>Doanh thu được xác định theo giá trị hợp lý của các khoản đã thu hoặc sẽ thu được.</p>
        <p>Doanh thu phát sinh từ giao dịch được xác định bởi thỏa thuận giữa doanh nghiệp với bên mua hoặc bên sử dụng tài sản. Nó được xác định bằng giá trị hợp lý của các khoản đã thu được hoặc sẽ thu được sau khi trừ (-) các khoản chiết khấu thương mại, chiết khấu thanh toán, giảm giá hàng bán và giá trị hàng bán bị trả lại.</p>
        <p>Đối với các khoản tiền hoặc tương đương tiền không được nhận ngay thì doanh thu được xác định bằng cách quy đổi giá trị danh nghĩa của các khoản sẽ thu được trong tương lai về giá trị thực tế tại thời điểm ghi nhận doanh thu theo tỷ lệ lãi suất hiện hành. Giá trị thực tế tại thời điểm ghi nhận doanh thu có thể nhỏ hơn giá trị danh nghĩa sẽ thu được trong tương lai.</p>
        <p>Khi hàng hóa hoặc dịch vụ được trao đổi để lấy hàng hóa hoặc dịch vụ tương tự về bản chất và giá trị thì việc trao đổi đó không được coi là một giao dịch tạo ra doanh thu.</p>
        <p>Khi hàng hóa hoặc dịch vụ được trao đổi để lấy hàng hóa hoặc dịch vụ khác không tương tự thì việc trao đổi đó được coi là một giao dịch tạo ra doanh thu. Trường hợp này doanh thu được xác định bằng giá trị hợp lý của hàng hóa hoặc dịch vụ nhận về, sau khi điều chỉnh các khoản tiền hoặc tương đương tiền trả thêm hoặc thu thêm. Khi không xác định được giá trị hợp lý của hàng hóa hoặc dịch vụ nhận về thì doanh thu được xác định bằng giá trị hợp lý của hàng hóa hoặc dịch vụ đem trao đổi, sau khi điều chỉnh các khoản tiền hoặc tương đương tiền trả thêm hoặc thu thêm.</p>

        <h2>NHẬN BIẾT GIAO DỊCH</h2>
        <p>Tiêu chuẩn nhận biết giao dịch trong chuẩn mực này được áp dụng riêng biệt cho từng giao dịch. Trong một số trường hợp, các tiêu chuẩn nhận biết giao dịch cần áp dụng tách biệt cho từng bộ phận của một giao dịch đơn lẻ để phản ánh bản chất của giao dịch đó. Ví dụ, khi trong giá bán một sản phẩm có một khoản đã định trước cho việc cung cấp dịch vụ sau bán hàng thì khoản doanh thu từ việc cung cấp dịch vụ sau bán hàng sẽ được dời lại cho đến khi doanh nghiệp thực hiện dịch vụ đó. Tiêu chuẩn nhận biết giao dịch còn được áp dụng cho hai hay nhiều giao dịch đồng thời có quan hệ với nhau về mặt thương mại. Trường hợp này phải xem xét chúng trong mối quan hệ tổng thể. Ví dụ, doanh nghiệp thực hiện việc bán hàng và đồng thời ký một hợp đồng khác để mua lại chính các hàng hóa đó sau một thời gian thì phải đồng thời xem xét cả hai hợp đồng và doanh thu không được ghi nhận.</p>

        <h2>DOANH THU BÁN HÀNG</h2>
        <p>Doanh thu bán hàng được ghi nhận khi đồng thời thỏa mãn tất cả năm (5) điều kiện sau:</p>
        <p><strong>(a)</strong> Doanh nghiệp đã chuyển giao phần lớn rủi ro và lợi ích gắn liền với quyền sở hữu sản phẩm hoặc hàng hóa cho người mua;</p>
        <p><strong>(b)</strong> Doanh nghiệp không còn nắm giữ quyền quản lý hàng hóa như người sở hữu hàng hóa hoặc quyền kiểm soát hàng hóa;</p>
        <p><strong>(c)</strong> Doanh thu được xác định tương đối chắc chắn;</p>
        <p><strong>(d)</strong> Doanh nghiệp đã thu được hoặc sẽ thu được lợi ích kinh tế từ giao dịch bán hàng;</p>
        <p><strong>(e)</strong> Xác định được chi phí liên quan đến giao dịch bán hàng.</p>
        <p>Doanh nghiệp phải xác định thời điểm chuyển giao phần lớn rủi ro và lợi ích gắn liền với quyền sở hữu hàng hóa cho người mua trong từng trường hợp cụ thể. Trong hầu hết các trường hợp, thời điểm chuyển giao phần lớn rủi ro trùng với thời điểm chuyển giao lợi ích gắn liền với quyền sở hữu hợp pháp hoặc quyền kiểm soát hàng hóa cho người mua.</p>
        <p>Trường hợp doanh nghiệp vẫn còn chịu phần lớn rủi ro gắn liền với quyền sở hữu hàng hóa thì giao dịch không được coi là hoạt động bán hàng và doanh thu không được ghi nhận. Doanh nghiệp còn phải chịu rủi ro gắn liền với quyền sở hữu hàng hóa dưới nhiều hình thức khác nhau, như:</p>
        <p><strong>(a)</strong> Doanh nghiệp còn phải chịu trách nhiệm để đảm bảo cho tài sản được hoạt động bình thường mà việc này không nằm trong các điều khoản bảo hành thông thường;</p>
        <p><strong>(b)</strong> Khi việc thanh toán tiền bán hàng còn chưa chắc chắn vì phụ thuộc vào người mua hàng hóa đó;</p>
        <p><strong>(c)</strong> Khi hàng hóa được giao còn chờ lắp đặt và việc lắp đặt đó là một phần quan trọng của hợp đồng mà doanh nghiệp chưa hoàn thành;</p>
        <p><strong>(d)</strong> Khi người mua có quyền huỷ bỏ việc mua hàng vì một lý do nào đó được nêu trong hợp đồng mua bán và doanh nghiệp chưa chắc chắn về khả năng hàng bán có bị trả lại hay không.</p>
        <p>Nếu doanh nghiệp chỉ còn phải chịu một phần nhỏ rủi ro gắn liền với quyền sở hữu hàng hóa thì việc bán hàng được xác định và doanh thu được ghi nhận. Ví dụ doanh nghiệp còn nắm giữ giấy tờ về quyền sở hữu hàng hóa chỉ để đảm bảo sẽ nhận được đủ các khoản thanh toán.</p>
        <p>Doanh thu bán hàng được ghi nhận chỉ khi đảm bảo là doanh nghiệp nhận được lợi ích kinh tế từ giao dịch. Trường hợp lợi ích kinh tế từ giao dịch bán hàng còn phụ thuộc yếu tố không chắc chắn thì chỉ ghi nhận doanh thu khi yếu tố không chắc chắn này đã xử lý xong (ví dụ, khi doanh nghiệp không chắc chắn là Chính phủ nước sở tại có chấp nhận chuyển tiền bán hàng ở nước ngoài về hay không). Nếu doanh thu đã được ghi nhận trong trường hợp chưa thu được tiền thì khi xác định khoản tiền nợ phải thu này là không thu được thì phải hạch toán vào chi phí sản xuất, kinh doanh trong kỳ mà không được ghi giảm doanh thu. Khi xác định khoản phải thu là không chắc chắn thu được (Nợ phải thu khó đòi) thì phải lập dự phòng nợ phải thu khó đòi mà không ghi giảm doanh thu. Các khoản nợ phải thu khó đòi khi xác định thực sự là không đòi được thì được bù đắp bằng nguồn dự phòng nợ phải thu khó đòi.</p>
        <p>Doanh thu và chi phí liên quan tới cùng một giao dịch phải được ghi nhận đồng thời theo nguyên tắc phù hợp. Các chi phí, bao gồm cả chi phí phát sinh sau ngày giao hàng (như chi phí bảo hành và chi phí khác), thường được xác định chắc chắn khi các điều kiện ghi nhận doanh thu được thỏa mãn. Các khoản tiền nhận trước của khách hàng không được ghi nhận là doanh thu mà được ghi nhận là một khoản nợ phải trả tại thời điểm nhận tiền trước của khách hàng. Khoản nợ phải trả về số tiền nhận trước của khách hàng chỉ được ghi nhận là doanh thu khi đồng thời thỏa mãn năm (5) điều kiện quy định ở đoạn 10.</p>
        <div class="disclaimer"><b>Câu hỏi:</b> Nhận tạm ứng trước hợp đồng thi công xây dựng có được ghi nhận doanh thu không? Trong trường hợp xuất hoá đơn thì có ghi nhận doanh thu không? Yêu cầu xuất hoá đơn là đúng hay sai?</div>

        <h2>DOANH THU CUNG CẤP DỊCH VỤ</h2>
        <p>Doanh thu của giao dịch về cung cấp dịch vụ được ghi nhận khi kết quả của giao dịch đó được xác định một cách đáng tin cậy. Trường hợp giao dịch về cung cấp dịch vụ liên quan đến nhiều kỳ thì doanh thu được ghi nhận trong kỳ theo kết quả phần công việc đã hoàn thành vào ngày lập Bảng Cân đối kế toán của kỳ đó. Kết quả của giao dịch cung cấp dịch vụ được xác định khi thỏa mãn tất cả bốn (4) điều kiện sau:</p>
        <p><strong>(a)</strong> Doanh thu được xác định tương đối chắc chắn;</p>
        <p><strong>(b)</strong> Có khả năng thu được lợi ích kinh tế từ giao dịch cung cấp dịch vụ đó;</p>
        <p><strong>(c)</strong> Xác định được phần công việc đã hoàn thành vào ngày lập Bảng Cân đối kế toán;</p>
        <p><strong>(d)</strong> Xác định được chi phí phát sinh cho giao dịch và chi phí để hoàn thành giao dịch cung cấp dịch vụ đó.</p>
        <p>Trường hợp giao dịch về cung cấp dịch vụ thực hiện trong nhiều kỳ kế toán thì việc xác định doanh thu của dịch vụ trong từng kỳ thường được thực hiện theo phương pháp tỷ lệ hoàn thành. Theo phương pháp này, doanh thu được ghi nhận trong kỳ kế toán được xác định theo tỷ lệ phần công việc đã hoàn thành.</p>
        <p>Doanh thu cung cấp dịch vụ chỉ được ghi nhận khi đảm bảo là doanh nghiệp nhận được lợi ích kinh tế từ giao dịch. Khi không thể thu hồi được khoản doanh thu đã ghi nhận thì phải hạch toán vào chi phí mà không được ghi giảm doanh thu. Khi không chắc chắn thu hồi được một khoản mà trước đó đã ghi vào doanh thu (Nợ phải thu khó đòi) thì phải lập dự phòng nợ phải thu khó đòi mà không ghi giảm doanh thu. Khoản nợ phải thu khó đòi khi xác định thực sự là không đòi được thì được bù đắp bằng nguồn dự phòng nợ phải thu khó đòi.</p>
        <p>Doanh nghiệp có thể ước tính doanh thu cung cấp dịch vụ khi thỏa thuận được với bên đối tác giao dịch những điều kiện sau:</p>
        <p><strong>(a)</strong> Trách nhiệm và quyền của mỗi bên trong việc cung cấp hoặc nhận dịch vụ;</p>
        <p><strong>(b)</strong> Giá thanh toán;</p>
        <p><strong>(c)</strong> Thời hạn và phương thức thanh toán.</p>
        <p>Để ước tính doanh thu cung cấp dịch vụ, doanh nghiệp phải có hệ thống kế hoạch tài chính và kế toán phù hợp. Khi cần thiết, doanh nghiệp có quyền xem xét và sửa đổi cách ước tính doanh thu trong quá trình cung cấp dịch vụ.</p>
        <p>Phần công việc đã hoàn thành được xác định theo một trong ba phương pháp sau, tuỳ thuộc vào bản chất của dịch vụ:</p>
        <p><strong>(a)</strong> Đánh giá phần công việc đã hoàn thành;</p>
        <p><strong>(b)</strong> So sánh tỷ lệ (%) giữa khối lượng công việc đã hoàn thành với tổng khối lượng công việc phải hoàn thành;</p>
        <p><strong>(c)</strong> Tỷ lệ (%) chi phí đã phát sinh so với tổng chi phí ước tính để hoàn thành toàn bộ giao dịch cung cấp dịch vụ.</p>
        <p>Phần công việc đã hoàn thành không phụ thuộc vào các khoản thanh toán định kỳ hay các khoản ứng trước của khách hàng.</p>
        <p>Trường hợp dịch vụ được thực hiện bằng nhiều hoạt động khác nhau mà không tách biệt được, và được thực hiện trong nhiều kỳ kế toán nhất định thì doanh thu từng kỳ được ghi nhận theo phương pháp bình quân. Khi có một hoạt động cơ bản so với các hoạt động khác thì việc ghi nhận doanh thu được thực hiện theo hoạt động cơ bản đó.</p>
        <p>Khi kết quả của một giao dịch về cung cấp dịch vụ không thể xác định được chắc chắn thì doanh thu được ghi nhận tương ứng với chi phí đã ghi nhận và có thể thu hồi.</p>
        <p>Trong giai đoạn đầu của một giao dịch về cung cấp dịch vụ, khi chưa xác định được kết quả một cách chắc chắn thì doanh thu được ghi nhận bằng chi phí đã ghi nhận và có thể thu hồi được. Nếu chi phí liên quan đến dịch vụ đó chắc chắn không thu hồi được thì không ghi nhận doanh thu, và chi phí đã phát sinh được hạch toán vào chi phí để xác định kết quả kinh doanh trong kỳ. Khi có bằng chứng tin cậy về các chi phí đã phát sinh sẽ thu hồi được thì doanh thu được ghi nhận theo quy định tại đoạn 16.</p>

        <h2>DOANH THU TỪ TIỀN LÃI, TIỀN BẢN QUYỀN, CỔ TỨC VÀ LỢI NHUẬN ĐƯỢC CHIA</h2>
        <p>Doanh thu phát sinh từ tiền lãi, tiền bản quyền, cổ tức và lợi nhuận được chia của doanh nghiệp được ghi nhận khi thỏa mãn đồng thời hai (2) điều kiện sau:</p>
        <p><strong>(a)</strong> Có khả năng thu được lợi ích kinh tế từ giao dịch đó;</p>
        <p><strong>(b)</strong> Doanh thu được xác định tương đối chắc chắn.</p>
        <p>Doanh thu từ tiền lãi, tiền bản quyền, cổ tức và lợi nhuận được chia được ghi nhận trên cơ sở:</p>
        <p><strong>(a)</strong> Tiền lãi được ghi nhận trên cơ sở thời gian và lãi suất thực tế từng kỳ;</p>
        <p><strong>(b)</strong> Tiền bản quyền được ghi nhận trên cơ sở dồn tích phù hợp với hợp đồng;</p>
        <p><strong>(c)</strong> Cổ tức và lợi nhuận được chia được ghi nhận khi cổ đông được quyền nhận cổ tức hoặc các bên tham gia góp vốn được quyền nhận lợi nhuận từ việc góp vốn.</p>
        <p>Lãi suất thực tế là tỷ lệ lãi dùng để quy đổi các khoản tiền nhận được trong tương lai trong suốt thời gian cho bên khác sử dụng tài sản về giá trị ghi nhận ban đầu tại thời điểm chuyển giao tài sản cho bên sử dụng. Doanh thu tiền lãi bao gồm số phân bổ các khoản chiết khấu, phụ trội, các khoản lãi nhận trước hoặc các khoản chênh lệch giữa giá trị ghi sổ ban đầu của công cụ nợ và giá trị của nó khi đáo hạn.</p>
        <p>Khi tiền lãi chưa thu của một khoản đầu tư đã được dồn tích trước khi doanh nghiệp mua lại khoản đầu tư đó, thì khi thu được tiền lãi từ khoản đầu tư, doanh nghiệp phải phân bổ vào cả các kỳ trước khi nó được mua. Chỉ có phần tiền lãi của các kỳ sau khi khoản đầu tư được mua mới được ghi nhận là doanh thu của doanh nghiệp. Phần tiền lãi của các kỳ trước khi khoản đầu tư được mua được hạch toán giảm giá trị của chính khoản đầu tư đó.</p>
        <p>Tiền bản quyền được tính dồn tích căn cứ vào các điều khoản của hợp đồng (ví dụ như tiền bản quyền của một cuốn sách được tính dồn tích trên cơ sở số lượng sách xuất bản từng lần và theo từng lần xuất bản) hoặc tính trên cơ sở hợp đồng từng lần.</p>
        <p>Doanh thu được ghi nhận khi đảm bảo là doanh nghiệp nhận được lợi ích kinh tế từ giao dịch. Khi không thể thu hồi một khoản mà trước đó đã ghi vào doanh thu thì khoản có khả năng không thu hồi được hoặc không chắc chắn thu hồi được đó phải hạch toán vào chi phí phát sinh trong kỳ, không ghi giảm doanh thu.</p>

        <h2>THU NHẬP KHÁC</h2>
        <p>Thu nhập khác quy định trong chuẩn mực này bao gồm các khoản thu từ các hoạt động xảy ra không thường xuyên, ngoài các hoạt động tạo ra doanh thu, gồm:</p>
        <p>Thu về thanh lý TSCĐ, nhượng bán TSCĐ;</p>
        <p>Thu tiền phạt khách hàng do vi phạm hợp đồng;</p>
        <p>Thu tiền bảo hiểm được bồi thường;</p>
        <p>Thu được các khoản nợ phải thu đã xóa sổ tính vào chi phí kỳ trước;</p>
        <p>Khoản nợ phải trả nay mất chủ được ghi tăng thu nhập;</p>
        <p>Thu các khoản thuế được giảm, được hoàn lại;</p>
        <p>Các khoản thu khác.</p>
        <p>Khoản thu về thanh lý TSCĐ, nhượng bán TSCĐ là tổng số tiền đã thu và sẽ thu được của người mua từ hoạt động thanh lý, nhượng bán TSCĐ. Các chi phí về thanh lý, nhượng bán TSCĐ được ghi nhận là chi phí để xác định kết quả kinh doanh trong kỳ.</p>
        <p>Thu được các khoản nợ phải thu đã xóa sổ tính vào chi phí của kỳ trước là khoản nợ phải thu khó đòi, xác định là không thu hồi được, đã được xử lý xóa sổ và tính vào chi phí để xác định kết quả kinh doanh trong các kỳ trước nay thu hồi được.</p>
        <p>Khoản nợ phải trả nay mất chủ là khoản nợ phải trả không xác định được chủ nợ hoặc chủ nợ không còn tồn tại.</p>

        <h2>TRÌNH BÀY BÁO CÁO TÀI CHÍNH</h2>
        <p>Trong báo cáo tài chính, doanh nghiệp phải trình bày:</p>
        <p><strong>(a)</strong> Chính sách kế toán được áp dụng trong việc ghi nhận doanh thu bao gồm phương pháp xác định phần công việc đã hoàn thành của các giao dịch về cung cấp dịch vụ;</p>
        <p><strong>(b)</strong> Doanh thu của từng loại giao dịch và sự kiện:</p>
        <p>Doanh thu bán hàng;</p>
        <p>Doanh thu cung cấp dịch vụ;</p>
        <p>Tiền lãi, tiền bản quyền, cổ tức và lợi nhuận được chia.</p>
        <p><strong>(c)</strong> Doanh thu từ việc trao đổi hàng hóa hoặc dịch vụ theo từng loại hoạt động trên.</p>
        <p><strong>(d)</strong> Thu nhập khác, trong đó trình bày cụ thể các khoản thu nhập bất thường.</p>
      `
    }
  };

  const DOCS = {
    "vas": {
      kind: "law",
      title: "Chuẩn mực kế toán Việt Nam — VAS 14",
      meta: "Chuẩn mực số 14 — Doanh thu và thu nhập khác",
      toc: [{ chapter: "VAS 14 — Doanh thu và thu nhập khác", articles: ["vas-14"] }],
      note: "Nội dung trang được đưa vào từ tài liệu người dùng cung cấp. Khi sử dụng cho mục đích pháp lý, kế toán hoặc kiểm toán chính thức, cần đối chiếu với văn bản gốc và các văn bản sửa đổi, bổ sung có liên quan."
    }
  };

  const BACKLINKS = {};

  const inner = document.getElementById('contentInner');
  const sidebarToc = document.getElementById('sidebarToc');
  const sidebarTocList = document.getElementById('sidebarTocList');
  const GROUP_LABEL = { law: "Thư viện pháp luật", topic: "Chứng chỉ nghề nghiệp", notes: "Notes" };

  function slugify(text, index) {
    const base = (text || '').toLowerCase()
      .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
      .replace(/đ/g, 'd')
      .replace(/[^a-z0-9]+/g, '-')
      .replace(/^-+|-+$/g, '');
    return 'toc-' + (base || 'section') + '-' + index;
  }

  function clearSidebarToc() {
    sidebarToc.classList.remove('visible');
    sidebarTocList.innerHTML = '';
  }

  function buildSidebarToc() {
    const headings = Array.from(inner.querySelectorAll('.article-body h2, .article-body h3')).filter(h => h.textContent.trim() !== 'HỆ THỐNG CHUẨN MỰC KẾ TOÁN VIỆT NAM');
    sidebarTocList.innerHTML = '';
    if (!headings.length) { clearSidebarToc(); return; }

    headings.forEach((h, i) => {
      h.id = slugify(h.textContent, i);
      const li = document.createElement('li');
      const a = document.createElement('a');
      a.href = '#' + h.id;
      a.textContent = h.textContent.trim();
      a.dataset.target = h.id;
      a.addEventListener('click', (ev) => {
        ev.preventDefault();
        h.scrollIntoView({ behavior: 'smooth', block: 'start' });
        history.replaceState(null, '', '#' + encodeURIComponent('vas-14') + '-' + h.id);
        setTimeout(() => setActiveToc(h.id), 50);
      });
      li.appendChild(a);
      sidebarTocList.appendChild(li);
    });
    sidebarToc.classList.add('visible');

    const observer = new IntersectionObserver((entries) => {
      const visible = entries.filter(x => x.isIntersecting).sort((a,b) => a.boundingClientRect.top - b.boundingClientRect.top);
      if (visible[0]) setActiveToc(visible[0].target.id);
    }, { root: null, rootMargin: '-90px 0px -65% 0px', threshold: 0 });
    headings.forEach(h => observer.observe(h));
  }

  function setActiveToc(id) {
    sidebarTocList.querySelectorAll('a').forEach(a => a.classList.toggle('active', a.dataset.target === id));
  }

  const previewEl = document.createElement('div');
  previewEl.className = 'link-preview';
  previewEl.id = 'linkPreview';
  document.body.appendChild(previewEl);
  let previewTimer = null;

  function stripWikiSyntax(text) {
    return (text || '').replace(/\[\[([a-z0-9\-]+)(?:\|([^\]]+))?\]\]/g, (m, id, label) => {
      return label || (ENTRIES[id] ? ENTRIES[id].title : id);
    });
  }

  function positionPreview(targetEl) {
    const rect = targetEl.getBoundingClientRect();
    const pw = 300, gap = 8;
    let left = rect.left;
    let top = rect.bottom + gap;
    if (left + pw > window.innerWidth - 12) left = window.innerWidth - pw - 12;
    if (left < 12) left = 12;
    if (top + 140 > window.innerHeight) top = rect.top - gap - 140;
    if (top < 12) top = 12;
    previewEl.style.left = left + 'px';
    previewEl.style.top = top + 'px';
  }

  function showPreview(id, targetEl) {
    const e = ENTRIES[id];
    if (!e) return;
    const doc = DOCS[e.doc];
    const temp = document.createElement('div');
    temp.innerHTML = e.bodyHtml || '';
    let excerpt = (temp.textContent || '').trim();
    if (excerpt.length > 170) excerpt = excerpt.slice(0, 170).trim() + '…';
    previewEl.innerHTML = `
      <div class="lp-title">${e.title}</div>
      <div class="lp-excerpt">${excerpt}</div>
      <div class="lp-meta">${doc ? doc.title : ''}${(e.crumb && e.crumb.length) ? ' · ' + e.crumb.join(' · ') : ''}</div>
    `;
    positionPreview(targetEl);
    previewEl.classList.add('visible');
  }

  function hidePreview() { previewEl.classList.remove('visible'); }

  function attachPreviews(root) {
    root.querySelectorAll('a.wiki[data-id], .backlinks-box a[data-id]').forEach(a => {
      a.addEventListener('mouseenter', () => {
        clearTimeout(previewTimer);
        previewTimer = setTimeout(() => showPreview(a.dataset.id, a), 200);
      });
      a.addEventListener('mousemove', () => positionPreview(a));
      a.addEventListener('mouseleave', () => { clearTimeout(previewTimer); hidePreview(); });
      a.addEventListener('focus', () => showPreview(a.dataset.id, a));
      a.addEventListener('blur', hidePreview);
    });
  }

  document.addEventListener('scroll', hidePreview, true);

  const sidebarLinks = () => Array.from(document.querySelectorAll('.article-list a[data-id], .doc-cover-link[data-id]'));

  function attachClicks(root) {
    root.querySelectorAll('a[data-id], button[data-id]').forEach(el => {
      el.addEventListener('click', (e) => { e.preventDefault(); go(el.dataset.id); });
    });
  }

  function renderHome() {
    clearSidebarToc();
    inner.innerHTML = `
      <p class="eyebrow">THƯ VIỆN PHÁP LUẬT</p>
      <h1 class="hero-title">Chuẩn mực kế toán Việt Nam</h1>
      <p class="hero-sub">Tra cứu nội dung chuẩn mực theo cấu trúc thư mục. Hiện thư viện này chứa VAS 14 — Doanh thu và thu nhập khác.</p>
      <div class="disclaimer"><b>Lưu ý:</b> Nội dung trên trang được trình bày để tra cứu và tự học. Khi áp dụng cho công việc thực tế, cần đối chiếu với văn bản gốc và các quy định hiện hành có liên quan.</div>
      <hr class="rule">
      <p class="section-label">Nội dung</p>
      <h2 class="section-title">Chuẩn mực đang có trong thư viện</h2>
      <div class="program-grid">
        <a class="program-card" href="#" data-id="vas-14">
          <div class="pc-kicker">CHUẨN MỰC KẾ TOÁN VIỆT NAM</div>
          <div class="pc-title">VAS 14 — Doanh thu và thu nhập khác</div>
          <p class="pc-desc">Quy định và hướng dẫn nguyên tắc, phương pháp kế toán doanh thu và thu nhập khác.</p>
        </a>
      </div>
    `;
    attachClicks(inner);
  }

  function renderDocCover(docId) {
    clearSidebarToc();
    const doc = DOCS[docId];
    if (!doc) return renderHome();
    const groupLabel = GROUP_LABEL[doc.kind] || '';
    inner.innerHTML = `
      <div class="breadcrumb"><button data-id="__home">TheLeanBasic</button><span class="sep">／</span><span>${groupLabel}</span></div>
      <p class="eyebrow">${groupLabel.toUpperCase()}</p>
      <h1 class="hero-title">${doc.title}</h1>
      <p class="hero-sub">${doc.meta}</p>
      ${doc.note ? `<div class="disclaimer">${doc.note}</div>` : ''}
      <p class="section-label">Mục lục</p>
      <ul class="toc-list">
        ${doc.toc.map(ch => `
          <li style="border:none;">
            <div class="toc-chapter-title">${ch.chapter}</div>
            ${ch.articles && ch.articles.length ? `
              <ul class="toc-list nested-toc">
                ${ch.articles.map(aid => `<li><a href="#" data-id="${aid}"><span class="toc-num">§</span><span>${ENTRIES[aid].title}</span></a></li>`).join('')}
              </ul>` : ''}
          </li>
        `).join('')}
      </ul>
    `;
    attachClicks(inner);
    window.scrollTo({ top: 0 });
  }

  function renderEntry(id) {
    const e = ENTRIES[id];
    if (!e) return renderHome();
    const doc = DOCS[e.doc];
    const crumbParts = [
      `<button data-id="__home">TheLeanBasic</button>`,
      `<button data-id="cover:${e.doc}">${doc.title}</button>`
    ].concat(e.crumb.map(c => `<span>${c}</span>`));

    inner.innerHTML = `
      <div class="breadcrumb">${crumbParts.join('<span class="sep">／</span>')}</div>
      <article>
        <h1 class="article-title">${e.title}</h1>
        <p class="article-meta">${e.meta}</p>
        <div class="article-body">${e.bodyHtml}</div>
      </article>
      <div class="related-nav">
        <a href="#" data-id="cover:${e.doc}"><span class="rn-label">Quay lại</span><span>${doc.title} — mục lục</span></a>
      </div>
    `;
    attachClicks(inner);
    attachPreviews(inner);
    buildSidebarToc();
    window.scrollTo({ top: 0 });
  }

  function setActive(id) {
    sidebarLinks().forEach(a => a.classList.toggle('active', a.dataset.id === id));
  }

  function renderRoute(id) {
    if (!id || id === '__home') { renderHome(); return; }
    if (id.startsWith('cover:')) { renderDocCover(id.slice(6)); return; }
    if (ENTRIES[id]) { renderEntry(id); return; }
    renderHome();
  }

  function go(id) {
    if (id === '__home') history.pushState({ id: null }, '', location.pathname);
    else history.pushState({ id }, '', '#' + encodeURIComponent(id));
    renderRoute(id);
    setActive(id === '__home' ? null : id);
    if (window.innerWidth <= 860) closeMenu();
  }

  sidebarLinks().forEach(a => a.addEventListener('click', (e) => { e.preventDefault(); go(a.dataset.id); }));

  window.addEventListener('popstate', (e) => {
    const id = e.state && e.state.id;
    renderRoute(id);
    setActive(id || null);
  });

  const initial = decodeURIComponent(location.hash.replace('#', ''));
  renderRoute(initial);
  if (initial) setActive(initial);

  const menuToggle = document.getElementById('menuToggle');
  function closeMenu() { document.body.classList.remove('menu-open'); menuToggle.setAttribute('aria-expanded', 'false'); }
  menuToggle.addEventListener('click', () => {
    const open = document.body.classList.toggle('menu-open');
    menuToggle.setAttribute('aria-expanded', String(open));
  });
  document.addEventListener('click', (e) => {
    if (document.body.classList.contains('menu-open') &&
        !document.getElementById('sidebar').contains(e.target) && e.target !== menuToggle) closeMenu();
  });

  document.getElementById('themeToggle').addEventListener('click', () => {
    const root = document.documentElement;
    const current = root.getAttribute('data-theme');
    const isDark = current === 'dark' || (!current && window.matchMedia('(prefers-color-scheme: dark)').matches);
    root.setAttribute('data-theme', isDark ? 'light' : 'dark');
  });

  const searchInput = document.getElementById('siteSearch');
  searchInput.addEventListener('input', () => {
    const q = searchInput.value.trim().toLowerCase();
    const allLinks = document.querySelectorAll('#sidebar .article-list a, #sidebar .doc-cover-link');
    if (!q) {
      allLinks.forEach(a => a.classList.remove('no-match'));
      document.querySelectorAll('#sidebar details').forEach(d => d.open = false);
      document.querySelector('#sidebar details').open = true;
      return;
    }
    allLinks.forEach(a => {
      const match = a.textContent.toLowerCase().includes(q);
      a.classList.toggle('no-match', !match);
      if (match) {
        let p = a.closest('details');
        while (p) { p.open = true; p = p.parentElement.closest('details'); }
      }
    });
  });
})();
</script>
